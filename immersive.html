<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zen Space | Nguyen Tan Thang</title>
  <meta name="description" content="An immersive focus room with ambient audio, interactive particle constellation, and pomodoro timer." />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>" />

  <style>
    body {
      background: #05070c;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #zen-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    .zen-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 24px;
    }
    .zen-pod {
      width: 100%;
      max-width: 480px;
      background: rgba(13, 17, 26, 0.75);
      border: 1px solid rgba(0, 229, 255, 0.25);
      border-radius: var(--radius-lg);
      padding: 36px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 229, 255, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      text-align: center;
    }
    .zen-timer-display {
      font-family: var(--font-mono);
      font-size: 4.5rem;
      font-weight: 700;
      letter-spacing: -2px;
      color: var(--accent-cyan);
      text-shadow: 0 0 25px rgba(0, 229, 255, 0.5);
    }
    .zen-modes {
      display: flex;
      gap: 8px;
    }
    .timer-mode-btn {
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 0.78rem;
      font-family: var(--font-mono);
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-secondary);
      transition: all var(--transition-fast);
    }
    .timer-mode-btn.is-active {
      background: var(--accent-cyan);
      color: #000000;
      font-weight: 600;
    }
    .zen-sounds-grid {
      display: flex;
      gap: 10px;
      width: 100%;
    }
    .zen-sound-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-family: var(--font-mono);
      transition: all var(--transition-fast);
    }
    .zen-sound-btn.is-playing {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      background: rgba(0, 229, 255, 0.1);
      box-shadow: 0 0 15px var(--accent-cyan-glow);
    }
    .zen-quote-box {
      min-height: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .zen-quote-text {
      font-size: 0.95rem;
      font-style: italic;
      color: var(--text-secondary);
      transition: opacity 0.4s ease;
      line-height: 1.5;
    }
    .zen-quote-author {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--accent-cyan);
      margin-top: 6px;
      transition: opacity 0.4s ease;
    }
  </style>
</head>

<body>
  <!-- Canvas Particles -->
  <canvas id="zen-canvas"></canvas>

  <!-- Top Navigation Header -->
  <header class="site-header" style="position: relative; z-index: 20; background: transparent; border-bottom: none;">
    <div class="site-header-inner">
      <a class="portfolio-button portfolio-button-secondary" href="index.html" style="padding: 8px 16px; font-size: 0.85rem;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        Back to Portfolio
      </a>

      <div style="font-family: var(--font-mono); font-size: 0.85rem; color: var(--accent-cyan); display: flex; align-items: center; gap: 8px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path></svg>
        ZEN FOCUS SPACE
      </div>
    </div>
  </header>

  <!-- Center Zen Pod -->
  <div class="zen-container">
    <div class="zen-pod">
      <div class="zen-modes">
        <button type="button" class="timer-mode-btn is-active" data-mins="25">Deep Work (25m)</button>
        <button type="button" class="timer-mode-btn" data-mins="5">Short Break (5m)</button>
        <button type="button" class="timer-mode-btn" data-mins="15">Long Break (15m)</button>
      </div>

      <div class="zen-timer-display" id="timer-display">25:00</div>

      <div style="display: flex; gap: 12px; width: 100%;">
        <button type="button" id="timer-start-btn" class="portfolio-button portfolio-button-primary" style="flex: 2;">
          Start Focus
        </button>
        <button type="button" id="timer-reset-btn" class="portfolio-button portfolio-button-secondary" style="flex: 1;">
          Reset
        </button>
      </div>

      <!-- Ambient Audio Synthesizers -->
      <div style="width: 100%;">
        <div style="font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 1px;">
          Ambient Audio (Web Audio API)
        </div>
        <div class="zen-sounds-grid">
          <button type="button" class="zen-sound-btn" data-sound="rain">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/></svg>
            Rain
          </button>
          <button type="button" class="zen-sound-btn" data-sound="waves">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/></svg>
            Waves
          </button>
          <button type="button" class="zen-sound-btn" data-sound="lofi">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            Lo-Fi Tone
          </button>
        </div>
      </div>

      <!-- Motivational Quote -->
      <div class="zen-quote-box">
        <div class="zen-quote-text" id="zen-quote-text">"Simplicity is prerequisite for reliability."</div>
        <div class="zen-quote-author" id="zen-quote-author">— Edsger W. Dijkstra</div>
      </div>
    </div>
  </div>

  <script src="js/zen.js"></script>
</body>
</html>
